<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Krishan Amin</title>
  <meta name="description" content="after this long and resplendent nightmare, myself">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/theme.css">

  <style>
    body {
      background: var(--bg-image);
      color: var(--fg);
      min-height: 100vh;
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      padding: 0 28px;
    }
    .wrap { max-width: 680px; margin: 0 auto; padding: 80px 0 72px; }

    header { display: flex; align-items: center; justify-content: space-between; }
    h1 {
      display: flex; align-items: center; gap: 11px;
      font-size: 18px; font-weight: 600; letter-spacing: -0.01em; margin: 0;
    }
    .mark {
      width: 9px; height: 9px;
      background: var(--ac-grad);
      box-shadow: 0 1px 2px rgba(0,0,0,0.25);
    }

    nav {
      display: flex; gap: 18px;
      font-family: var(--font-mono);
      font-size: 13px; letter-spacing: 0.02em; color: var(--mut);
    }
    nav a { transition: color .15s; }
    nav a:hover { color: var(--ac); }

    .rule { height: 2px; background: var(--ac-grad); margin-top: 16px; }

    .tagline {
      font-size: 15px; line-height: 1.55; color: var(--mut);
      font-weight: 400; margin: 16px 0 0; max-width: 52ch;
    }

    main { margin-top: 40px; }

    .post {
      display: grid; grid-template-columns: 5.5rem 1fr auto;
      gap: 1rem; align-items: baseline;
      padding: 0.72rem 14px; margin: 0 -14px;
      transition: background .12s, color .12s;
    }
    .post:hover { background: var(--ac-soft); color: var(--ac); }
    .post-date {
      font-family: var(--font-mono);
      font-size: 12.5px; letter-spacing: 0.02em; color: var(--mut); white-space: nowrap;
    }
    .post-title { font-size: 17px; font-weight: 500; line-height: 1.35; letter-spacing: -0.01em; }
    .post-tag {
      font-family: var(--font-mono);
      font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--dim); white-space: nowrap;
    }

    footer {
      display: flex; align-items: center; gap: 9px; margin-top: 48px;
      font-family: var(--font-mono);
      font-size: 12px; letter-spacing: 0.02em; color: var(--dim);
    }
    .footer-mark { width: 7px; height: 7px; background: var(--ac-grad); }

    @media (max-width: 560px) {
      .post { grid-template-columns: 4.5rem 1fr; }
      .post-tag { display: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">

    <header>
      <h1><span class="mark"></span>Krishan Amin</h1>
      <nav>
        <a href="https://github.com/krishan99">github</a>
        <a href="mailto:krishanamin99@gmail.com">email</a>
      </nav>
    </header>

    <div class="rule"></div>

    <p class="tagline">after this long and resplendent nightmare, myself</p>

    <main>
<!-- POSTS -->
    </main>

    <footer>
      <span class="footer-mark"></span>hand-written html &middot; no trackers &middot; &copy; 2026
    </footer>

  </div>
</body>
</html>
